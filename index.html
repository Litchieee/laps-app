= String(str||'').match(/[\\d.]+/); return m ? parseFloat(m[0]) : 0; };\n    const paceSec = p => { const m = String(p||'').match(/^(\\d+):(\\d{2})$/); return m ? (+m[1])*60 + (+m[2]) : null; };\n    const secPace = sec => Math.floor(sec/60) + ':' + String(Math.round(sec%60)).padStart(2,'0');\n\n    const hr = s.today.getHours();\n    const greeting = (hr<11 ? 'Good morning' : hr<17 ? 'Good afternoon' : 'Good evening') + ', Litch';\n\n    const condDay = s.conditions?.[key0] || {};\n    const TEMPS = [['cool','Cool'],['mild','Mild'],['warm','Warm'],['hot','Hot']];\n    const condChips = TEMPS.map(([k,l]) => ({\n      label:l, select:this.setCondition('temp',k),\n      bg: condDay.temp===k ? INK : SURF, color: condDay.temp===k ? '#faf7f0' : MUTED,\n      border: condDay.temp===k ? INK : LINE,\n    })).concat([{\n      label:'Windy', select:this.setCondition('windy'),\n      bg: condDay.windy ? INK : SURF, color: condDay.windy ? '#faf7f0' : MUTED,\n      border: condDay.windy ? INK : LINE,\n    }]);\n    let condGuidance = '';\n    if(condDay.temp==='hot') condGuidance = \"Hot out — add 15–20s/mi to today's target and run by effort, not the watch.\";\n    else if(condDay.temp==='warm') condGuidance = 'Warm — about 8s/mi slower is the same effort. No need to force the number.';\n    if(condDay.windy) condGuidance = (condGuidance ? condGuidance + ' ' : '') + 'Wind costs a few seconds per mile — effort over pace.';\n    const condSummary = condDay.realTempF ? (condDay.realTempF + '°F, ' + condDay.temp + (condDay.windy?', windy':'')) : [condDay.temp ? condDay.temp : null, condDay.windy ? 'windy' : null].filter(Boolean).join(', ');\n    const todayDateLine = s.today.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'}) + (condSummary ? ' · ' + condSummary : ' · tap conditions below');\n\n    // readiness: from check-in (sleep+legs), softened by 7d/28d load\n    const readinessFor = k => {\n      const r = s.appState.readiness?.[k];\n      if(!r) return null;\n      if(r.sleep && r.legs) return Math.round(((r.sleep + r.legs) / 10) * 100);\n      if(r.feel) return Math.round((r.feel/5)*100);\n      return null;\n    };\n    const load = e.loadGauge(s.appState.runLogs, s.today);\n    let readinessRaw = readinessFor(key0);\n    const readinessBars = [];\n    for(let i=6;i>=0;i--){\n      const k = ds(e.addDays(s.today,-i));\n      const v = readinessFor(k);\n      readinessBars.push({\n        height: (v ? Math.max(18, Math.round(v*0.42)) : 8) + 'px',\n        color: v==null ? '#e7e1d4' : v>=80 ? GREEN : v>=60 ? ACCENT : '#c0705f',\n      });\n    }\n    let readinessPct = '—', readinessColor = MUTED;\n    if(readinessRaw!=null){\n      let adj = readinessRaw - (load.tone==='high' ? 8 : 0);\n      adj = Math.max(20, Math.min(100, adj));\n      readinessPct = adj + '%';\n      readinessColor = adj>=80 ? GREEN : adj>=60 ? ACCENT : '#c0705f';\n    }\n    const needsCheckin = readinessFor(key0)==null;\n    const SLEEPL = ['','1','2','3','4','5'];\n    const chipSet = (val, setter) => [1,2,3,4,5].map(n => ({\n      label: SLEEPL[n], select: setter(n),\n      bg: val===n ? ACCENT : SURF, color: val===n ? '#fff' : INK, border: val===n ? ACCENT : LINE,\n    }));\n    const sleepChips = chipSet(s.checkinSleep, this.setSleep);\n    const legsChips = chipSet(s.checkinLegs, this.setLegs);\n    const ciAvg = (s.checkinSleep + s.checkinLegs) / 2;\n    const checkinHint = ciAvg>=4.5 ? 'Fresh — good day to push the quality work.' : ciAvg>=3 ? 'Normal. Run the plan as written.' : 'Beat up — the plan will soften today automatically.';\n\n    // weekly volume vs plan\n    const dowIdx = (s.today.getDay()+6)%7;\n    const weekStart = e.addDays(s.today, -dowIdx);\n    let weeklyMiles = 0, weeklyTarget = 0;\n    for(let i=0;i<7;i++){\n      const d = e.addDays(weekStart,i), k = ds(d);\n      const lg = s.appState.runLogs[k];\n      if(lg?.distance) weeklyMiles += lg.distance;\n      const w = e.getWorkout(d, false);\n      weeklyTarget += numOf(w.run?.dist || w.run?.total);\n    }\n    weeklyMiles = Math.round(weeklyMiles*10)/10;\n    weeklyTarget = Math.round(weeklyTarget*10)/10 || 1;\n    const wpct = Math.max(0, Math.min(1, weeklyMiles/weeklyTarget));\n    const CIRC = 126;\n    const weeklyHeadline = weeklyMiles + ' of ' + weeklyTarget + ' mi this week';\n    const weeklyNote = wpct>=1 ? \"Week's volume is in. Anything more is a bonus.\"\n      : load.tone==='high' ? 'Ahead of your usual load — keep the easy days easy.'\n      : 'On pace. ' + Math.round((weeklyTarget-weeklyMiles)*10)/10 + ' mi left across the rest of the week.';\n\n    // race countdown\n    const raceDate = e.nextRaceDate(s.today);\n    const raceDateLabel = raceDate.toLocaleDateString('en-US',{month:'long', day:'numeric', year:'numeric'});\n    const daysToRace = s.daysToRace;\n\n    // personal bests\n    let longestEntry = null, bestPaceEntry = null;\n    let weekTotals = {};\n    logEntriesForPRs: {\n      Object.entries(s.appState.runLogs).forEach(([k,l]) => {\n        if(l.distance && (!longestEntry || l.distance > longestEntry.distance)) longestEntry = { key:k, distance: l.distance };\n        const ps2 = paceSec(l.pace);\n        if(ps2 && l.distance >= 2 && (!bestPaceEntry || ps2 < bestPaceEntry.sec)) bestPaceEntry = { key:k, sec: ps2, pace: l.pace };\n        const wk = ds(e.addDays(new Date(k+'T00:00:00'), -((new Date(k+'T00:00:00').getDay()+6)%7)));\n        weekTotals[wk] = (weekTotals[wk]||0) + (l.distance||0);\n      });\n    }\n    let bestWeek = null;\n    Object.entries(weekTotals).forEach(([wk,mi]) => { if(!bestWeek || mi > bestWeek.miles) bestWeek = { key:wk, miles: Math.round(mi*10)/10 }; });\n    const fmtShort = k => new Date(k+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});\n    const prList = [\n      longestEntry ? { label: longestEntry.distance + ' mi', sub: 'Longest run · ' + fmtShort(longestEntry.key) } : null,\n      bestPaceEntry ? { label: bestPaceEntry.pace + '/mi', sub: 'Fastest logged pace · ' + fmtShort(bestPaceEntry.key) } : null,\n      bestWeek ? { label: bestWeek.miles + ' mi', sub: 'Best week · week of ' + fmtShort(bestWeek.key) } : null,\n    ].filter(Boolean);\n\n    // up next\n    const DS3 = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\n    const upNext = [1,2,3].map(i => {\n      const d = e.addDays(s.today,i), w = e.getWorkout(d,false);\n      const label = w.run ? ((w.run.dist || w.run.total || '') + ' ' + (w.run.type||'')).trim() : 'Rest';\n      return { dayShort: DS3[(d.getDay()+6)%7], label: label + (w.lift ? ' + ' + w.lift.name : '') };\n    });\n\n    // shoes\n    const shoe = s.shoes;\n    let hasShoe = !!shoe, shoeMiles = '—', shoeLabel = 'add shoes', shoeColor = MUTED, shoeName = '', shoeDetail = '';\n    if(shoe){\n      let m = shoe.startMiles || 0;\n      Object.entries(s.appState.runLogs).forEach(([k,l]) => { if(k >= shoe.since && l.distance) m += l.distance; });\n      m = Math.round(m);\n      shoeMiles = String(m); shoeLabel = 'mi on shoes';\n      shoeColor = m>450 ? '#c0705f' : m>300 ? ACCENT : GREEN;\n      shoeName = shoe.name;\n      shoeDetail = m + ' mi since ' + new Date(shoe.since+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) + (m>450 ? ' · time to replace' : m>300 ? ' · watch the cushioning' : '');\n    }\n\n    // routes\n    const routeChips = (s.routes||[]).map(r => ({ label: r.name + ' · ' + r.dist + 'mi', select: this.pickRoute(r.dist) }));\n    const routeList = (s.routes||[]).map(r => ({ label: r.name + ' · ' + r.dist + ' mi', remove: this.removeRoute(r.id) }));\n\n    // records\n    const logEntries = Object.entries(s.appState.runLogs);\n    let bestSec = null, longest = 0, sum30 = 0, n30 = 0;\n    const cutoff = ds(e.addDays(s.today,-30));\n    logEntries.forEach(([k,l]) => {\n      const ps = paceSec(l.pace);\n      if(ps){ if(bestSec==null || ps<bestSec) bestSec = ps; if(k>=cutoff){ sum30 += ps; n30++; } }\n      if(l.distance && l.distance>longest) longest = l.distance;\n    });\n    const avgPace = n30 ? secPace(sum30/n30) : '—';\n    const bestPace = bestSec ? secPace(bestSec) : '—';\n    const longestRun = longest ? (Math.round(longest*10)/10) + 'mi' : '—';\n\n    // 12-week volume sparkline\n    const weeks = [];\n    for(let w=11; w>=0; w--){\n      const wStart = e.addDays(weekStart, -7*w);\n      let miles = 0;\n      for(let i=0;i<7;i++){ const l = s.appState.runLogs[ds(e.addDays(wStart,i))]; if(l?.distance) miles += l.distance; }\n      weeks.push(miles);\n    }\n    const wMax = Math.max(1, ...weeks);\n    const volumeSparkline = weeks.map((v,i) => Math.round((i/11)*292) + ',' + Math.round(52 - (v/wMax)*46)).join(' ');\n\n    return {\n      ...base,\n      greeting, todayDateLine, condChips, condGuidance,\n      readinessPct, readinessColor, readinessBars, needsCheckin,\n      checkinButtonLabel: needsCheckin ? \"Do today's check-in\" : 'Update check-in',\n      sleepChips, legsChips, checkinHint,\n      weeklyDash: String(CIRC), weeklyOffset: String(Math.round(CIRC*(1-wpct))),\n      weeklyHeadline, weeklyNote, upNext,\n      hasShoe, shoeName, shoeDetail, shoeMiles, shoeLabel, shoeColor,\n      hasRoutes: routeChips.length>0, routeChips, routeList,\n      avgPace, bestPace, longestRun, volumeSparkline,\n      daysToRace, raceDateLabel, hasPrs: prList.length>0, prList,\n      saveToast: s.saveToast || '',\n      streak: s.streak,\n      ringTrack: RING_TRACK,\n      ringOffset: s.ringAnimated ? Math.round(RING_ARC * (1 - pct)) : RING_ARC,\n      streakRingOffset: s.ringAnimated ? Math.round(119.4 * (1 - pct)) : 119.4,\n      nextMilestoneText: (next - s.streak) + ' days to your next marker (' + next + ')',\n      todayPending: s.todayPending,\n      runType: run.type || 'Rest',\n      runDistValue: distMatch ? distMatch[1] : (run.dist || run.total || '\\u2014'),\n      runDistUnit: distMatch && distMatch[2] ? distMatch[2] : 'mi',\n      runPace: run.pace || '',\n      runNote: run.note || run.desc || '',\n      runWhy: run.why || '',\n      paceAdapted: !!run.adapted,\n      adaptReason: run.adapted ? (s.adaptive?.reason || 'Your prescribed pace shifted based on recent logged runs.') : '',\n      hasLift: !!s.workout?.lift,\n      liftName: s.workout?.lift?.name || '',\n      openTodayLift: this.openLiftDetail(s.workout?.lift),\n      statusTag, statusColor, statusNote,\n      todayLog: s.todayLog,\n      todayLogSummary: s.todayLog ? [s.todayLog.distance ? s.todayLog.distance+' mi' : null, s.todayLog.pace ? s.todayLog.pace+'/mi' : null, s.todayLog.feel ? FEEL[s.todayLog.feel] : null].filter(Boolean).join('  \\u00b7  ') : '',\n      showLogButton: !s.todayLog,\n      weekDays: s.weekDays,\n      totalMiles: Math.round(totalMiles*10)/10, loggedCount,\n      milestonesReached: markers.filter(m=>m<=s.streak).length,\n      milestoneList, tapestryMonths: months,\n      weightHasData: !!wt, weightEmpty: !wt,\n      weightLatest: wt?.latest ?? '',\n      weightChangeText: wt ? (wt.change>=0?'+':'')+wt.change+' lbs' : '',\n      weightChangeColor: wt && wt.change < 0 ? GREEN : INK,\n      weightSparkline: sparkline,\n      weightEntries: wt ? wt.entries.map(([dkey,v]) => ({ dateLabel: new Date(dkey+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}), lbs:v.lbs })) : [],\n      planWeekNum: s.planWeek,\n      planPhaseLabel: PHASE_NAMES[phaseOfWeek(s.planWeek)] + (pw.isDeload ? ' \\u00b7 deload' : ''),\n      planDays, weekChips,\n      showDayDetail: !!s.showDayDetail,\n      dayDetailDate: dd.date, dayDetailStatus: dd.status, dayDetailAssigned: dd.assigned,\n      dayDetailDist: dd.dist, dayDetailPace: dd.pace, dayDetailFeel: dd.feel,\n      dayDetailSource: dd.source, dayDetailElev: dd.elev, dayDetailHasElev: dd.elev !== '\\u2014',\n      totalElevation: totalElevation > 0 ? Math.round(totalElevation).toLocaleString() : '', hasElevation: totalElevation > 0,\n      showCelebration: !!s.celebration,\n      celebrationEyebrow: s.celebration?.type==='milestone' ? 'Marker reached' : 'Fastest yet',\n      celebrationValue: s.celebration?.type==='milestone' ? String(s.celebration.value) : String(s.celebration?.value||''),\n      celebrationSub: s.celebration?.type==='milestone'\n        ? s.celebration.value + ' days in a row. That\\u2019s just who you are now.'\n        : 'Fastest pace you\\u2019ve ever logged: ' + (s.celebration?.value||'') + ' per mile.',\n    };\n  }\n}\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
