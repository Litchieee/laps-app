    // its OWN frames — from local text at the root, or text obtained from

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

dashoffset 1.2s cubic-bezier(.32,.72,0,1);\"><\u002Fcircle>\n                <\u002Fsvg>\n                <div style=\"position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;\">\n                  <div style=\"font-size:68px; font-weight:800; color:#1c1c1a; line-height:1; letter-spacing:-0.04em; font-variant-numeric:tabular-nums;\">{{ streak }}<\u002Fdiv>\n                  <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:#8a8478; margin-top:6px;\">day streak<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:11px; color:#b3ac9e; margin-top:14px;\">{{ nextMilestoneText }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- TODAY'S RUN -->\n            <div style=\"background:#1c1c1a; border-radius:20px; padding:20px 20px 18px; margin-bottom:12px;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;\">\n                <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:#e8c07a;\">Today's run<\u002Fdiv>\n                <sc-if value=\"{{ paceAdapted }}\"><div style=\"font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:0.1em; text-transform:uppercase; color:#e8c07a; border:1px solid rgba(232,192,122,0.4); border-radius:10px; padding:2px 7px;\">adapted<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"display:flex; align-items:baseline; gap:8px; margin-bottom:4px;\">\n                <div style=\"font-size:44px; font-weight:800; color:#faf7f0; letter-spacing:-0.03em; line-height:1; font-variant-numeric:tabular-nums;\">{{ runDistValue }}<\u002Fdiv>\n                <div style=\"font-size:15px; color:#6b665c; padding-bottom:4px;\">{{ runDistUnit }}<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; color:#e8c07a; padding-bottom:5px; letter-spacing:0.02em;\">{{ runType }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ runPace }}\"><div style=\"font-size:13px; color:#a39d90; margin-bottom:6px;\">{{ runPace }} target<\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ runNote }}\"><div style=\"font-size:11px; color:#6b665c; line-height:1.6; padding-top:10px; border-top:1px solid rgba(255,255,255,0.06);\">{{ runNote }}<\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ adaptReason }}\"><div style=\"font-size:11px; color:#6b665c; line-height:1.6; padding-top:10px; border-top:1px solid rgba(255,255,255,0.06);\">{{ adaptReason }}<\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ hasLift }}\"><button sc-camel-on-click=\"{{ openTodayLift }}\" class=\"tap\" style=\"margin-top:12px; background:none; border:1px solid rgba(232,192,122,0.25); border-radius:10px; padding:8px 13px; font-size:11px; color:#e8c07a; font-family:'IBM Plex Mono',monospace; letter-spacing:0.07em;\">+ {{ liftName }}<\u002Fbutton><\u002Fsc-if>\n              <div style=\"display:flex; align-items:center; gap:7px; margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.06);\">\n                <div style=\"width:6px; height:6px; border-radius:50%; background:{{ statusColor }}; flex-shrink:0;\"><\u002Fdiv>\n                <div style=\"font-size:11px; color:#6b665c; line-height:1.4;\">{{ statusNote }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- LOGGED / CHECK-IN -->\n            <sc-if value=\"{{ todayLog }}\">\n              <div class=\"pop\" style=\"background:#eef2ec; border:1px solid #d6e0d3; border-radius:14px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;\">\n                <div>\n                  <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:#3f5a43;\">Logged<\u002Fdiv>\n                  <sc-if value=\"{{ todayLogSummary }}\"><div style=\"font-size:12px; color:#5c7a5f; margin-top:3px; font-weight:500;\">{{ todayLogSummary }}<\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ openLog }}\" class=\"tap\" style=\"background:#fff; border:1px solid #d6e0d3; border-radius:10px; padding:7px 12px; font-size:11px; font-weight:600; color:#3f5a43;\">Edit<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ needsCheckin }}\">\n              <button sc-camel-on-click=\"{{ openCheckin }}\" class=\"tap\" style=\"width:100%; text-align:left; background:#fff; border:1px solid #e7e1d4; border-radius:14px; padding:13px 16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;\">\n                <div style=\"font-size:13px; font-weight:600; color:#1c1c1a;\">Morning check-in<\u002Fdiv>\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\"><path d=\"M6 4l4 4-4 4\" stroke=\"#8a8478\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fsc-if>\n\n            <!-- UP NEXT -->\n            <div style=\"display:flex; gap:8px; margin-bottom:12px;\">\n              <sc-for list=\"{{ upNext }}\" as=\"u\" hint-placeholder-count=\"3\">\n                <div style=\"flex:1; background:#fff; border:1px solid #e7e1d4; border-radius:14px; padding:12px 8px; text-align:center;\">\n                  <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:#8a8478; margin-bottom:5px;\">{{ u.dayShort }}<\u002Fdiv>\n                  <div style=\"font-size:11px; color:#1c1c1a; line-height:1.35;\">{{ u.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <!-- RACE + READINESS ROW -->\n            <div style=\"display:flex; gap:8px; margin-bottom:12px;\">\n              <div style=\"flex:3; background:#fff; border:1px solid #e7e1d4; border-radius:14px; padding:12px 14px;\">\n                <div style=\"font-size:11px; color:#8a8478;\">Half marathon · {{ raceDateLabel }}<\u002Fdiv>\n                <div style=\"font-size:17px; font-weight:700; color:#c9922e; margin-top:3px; font-variant-numeric:tabular-nums;\">{{ daysToRace }} days<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:2; background:#fff; border:1px solid #e7e1d4; border-radius:14px; padding:12px 10px; text-align:center;\">\n                <div style=\"font-size:20px; font-weight:700; color:{{ readinessColor }}; font-variant-numeric:tabular-nums;\">{{ readinessPct }}<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:0.1em; text-transform:uppercase; color:#8a8478; margin-top:3px;\">readiness<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- WEEKLY -->\n            <div style=\"background:#fff; border:1px solid #e7e1d4; border-radius:14px; padding:13px 14px; margin-bottom:12px;\">\n              <div style=\"font-size:12px; font-weight:600; color:#1c1c1a;\">{{ weeklyHeadline }}<\u002Fdiv>\n              <div style=\"font-size:11px; color:#8a8478; margin-top:3px; line-height:1.5;\">{{ weeklyNote }}<\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isRecord }}\">\n          <div class=\"fu\">\n            <div style=\"background:#fff; border:1px solid #e7e1d4; border-radius:18px; padding:16px; margin-bottom:12px;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:flex-end;\">\n                <div>\n                  <div style=\"font-size:30px; font-weight:700; letter-spacing:-0.02em; color:#1c1c1a; font-variant-numeric:tabular-nums;\">{{ totalMiles }}<\u002Fdiv>\n                  <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:#8a8478; margin-top:2px;\">miles all time<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align:right;\">\n                  <div style=\"font-size:13px; font-weight:600; color:#1c1c1a;\">{{ loggedCount }} runs<\u002Fdiv>\n                  <div style=\"font-size:11px; color:#8a8478;\">{{ streak }} day streak<\u002Fdiv>\n                  <sc-if value=\"{{ hasElevation }}\"><div style=\"font-size:11px; color:#8a8478;\">{{ totalElevation }} ft climbed<\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px;\">\n                <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:#8a8478; margin-bottom:6px;\">Last 12 weeks<\u002Fdiv>\n                <svg width=\"100%\" height=\"58\" sc-camel-view-box=\"0 0 292 58\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;\">\n                  <polyline points=\"{{ volumeSparkline }}\" fill=\"none\" stroke=\"#c9922e\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline>\n                <\u002Fsvg>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex; gap:8px; margin-bottom:16px;\">\n              <div style=\"flex:1; background:#fff; border:1px solid #e7e1d4; border-radius:16px; padding:13px 8px; text-align:center;\">\n                <div style=\"font-size:17px; font-weight:700; color:#1c1c1a;\">{{ avgPace }}<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:0.08em; text-transform:uppercase; color:#8a8478; margin-top:3px;\">avg pace 30d<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1; background:#fff; border:1px solid #e7e1d4; border-radius:16px; padding:13px 8px; text-align:center;\">\n                <div style=\"font-size:17px; font-weight:700; color:#5c7a5f;\">{{ bestPace }}<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:0.08em; text-transform:uppercase; color:#8a8478; margin-top:3px;\">best pace<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1; background:#fff; border:1px solid #e7e1d4; border-radius:16px; padding:13px 8px; text-align:center;\">\n                <div style=\"font-size:17px; font-weight:700; color:#c9922e;\">{{ longestRun }}<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:0.08em; text-transform:uppercase; color:#8a8478; margin-top:3px;\">longest run<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex; background:#fff; border:1px solid #e7e1d4; border-radius:16px; overflow:hidden; margin-bottom:16px;\">\n              <sc-for list=\"{{ weekDays }}\" as=\"d\" hint-placeholder-count=\"7\">\n                <div style=\"flex:1; text-align:center; padding:11px 0; background:{{ d.bg }};\">\n                  <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; color:{{ d.labelColor }};\">{{ d.label }}<\u002Fdiv>\n                  <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:{{ d.typeColor }}; margin-top:4px;\">{{ d.mark }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"font-size:12px; color:#8a8478; line-height:1.6; margin-bottom:12px;\">Every square is one day of the streak. Tap any square to open it.<\u002Fdiv>\n            <sc-for list=\"{{ tapestryMonths }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"margin-bottom:16px;\">\n                <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:#8a8478; margin-bottom:7px;\">{{ m.label }}<\u002Fdiv>\n                <div style=\"display:flex; flex-wrap:wrap; gap:3px;\">\n                  <sc-for list=\"{{ m.days }}\" as=\"d\" hint-placeholder-count=\"30\">\n                    <button sc-camel-on-click=\"{{ d.tap }}\" class=\"tap\" style=\"width:12px; height:12px; padding:0; border-radius:3px; background:{{ d.color }}; border:1px solid {{ d.border }};\"><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <div style=\"display:flex; gap:14px; align-items:center; padding:12px 0 16px; border-top:1px solid #ece6da;\">\n              <div style=\"display:flex; align-items:center; gap:5px;\"><div style=\"width:9px; height:9px; border-radius:2px; background:#c9922e;\"><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace; font-size:8px; color:#8a8478;\">logged<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:5px;\"><div style=\"width:9px; height:9px; border-radius:2px; background:#8a4a30;\"><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace; font-size:8px; color:#8a8478;\">imported<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:5px;\"><div style=\"width:9px; height:9px; border-radius:2px; background:#eccfc2;\"><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace; font-size:8px; color:#8a8478;\">ran, unlogged<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:5px;\"><div style=\"width:9px; height:9px; border-radius:2px; background:#faf7f0; border:1px solid #1c1c1a;\"><\u002Fdiv><span style=\"font-family:'IBM Plex Mono',monospace; font-size:8px; color:#8a8478;\">missed<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:#8a8478; margin-bottom:6px;\">Milestones<\u002Fdiv>\n            <sc-for list=\"{{ milestoneList }}\" as=\"ms\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid #ece6da;\">\n                <div style=\"font-size:14px; font-weight:500; color:{{ ms.labelColor }};\">{{ ms.label }}<\u002Fdiv>\n                <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:{{ ms.statusColor }};\">{{ ms.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ hasPrs }}\">\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:#8a8478; margin:20px 0 6px;\">Personal bests<\u002Fdiv>\n              <sc-for list=\"{{ prList }}\" as=\"pr\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid #ece6da;\">\n                  <div style=\"font-size:14px; font-weight:600; color:#1c1c1a;\">{{ pr.label }}<\u002Fdiv>\n                  <div style=\"font-size:11px; color:#8a8478;\">{{ pr.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ══════════ BODY ══════════ -->\n        <sc-if value=\"{{ isBody }}\">\n          <div class=\"fu\">\n            <sc-if value=\"{{ weightHasData }}\">\n              <div style=\"background:#fff; border:1px solid #e7e1d4; border-radius:18px; padding:16px; margin-bottom:12px;\">\n                <div style=\"display:flex; justify-content:space-between; align-items:flex-end;\">\n                  <div>\n                    <div style=\"font-size:38px; font-weight:700; letter-spacing:-0.02em; color:#1c1c1a; font-variant-numeric:tabular-nums; line-height:1;\">{{ weightLatest }}<\u002Fdiv>\n                    <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:#8a8478; margin-top:5px;\">lbs, latest<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:14px; font-weight:600; color:{{ weightChangeColor }};\">{{ weightChangeText }}<\u002Fdiv>\n                <\u002Fdiv>\n                <svg width=\"100%\" height=\"70\" sc-camel-view-box=\"0 0 292 70\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block; margin-top:12px;\">\n                  <polyline points=\"{{ weightSparkline }}\" fill=\"none\" stroke=\"#c9922e\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline>\n                <\u002Fsvg>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ weightEmpty }}\">\n              <div style=\"background:#fff; border:1px solid #e7e1d4; border-radius:18px; padding:18px; margin-bottom:12px;\">\n                <div style=\"font-family:'Instrument Serif',serif; font-size:22px; color:#1c1c1a; margin-bottom:6px;\">Nothing logged yet<\u002Fdiv>\n                <div style=\"font-size:12px; color:#8a8478; line-height:1.6;\">Log it whenever. The trend matters, single days don't.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"background:#fff; border:1px solid #e7e1d4; border-radius:18px; padding:16px; margin-bottom:12px;\">\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:#8a8478; margin-bottom:8px;\">Today's weight (lbs)<\u002Fdiv>\n              <input value=\"{{ weightForm }}\" sc-camel-on-change=\"{{ setWeightForm }}\" placeholder=\"168.4\" sc-camel-input-mode=\"decimal\" style=\"width:100%; background:transparent; border:none; border-bottom:2px solid #e7e1d4; padding:6px 0; font-size:26px; font-weight:700; color:#1c1c1a; outline:none; margin-bottom:14px;\">\n              <button sc-camel-on-click=\"{{ saveWeight }}\" class=\"tap\" style=\"width:100%; padding:13px 0; border:none; border-radius:14px; background:#c9922e; color:#fff; font-size:12px; font-weight:700; letter-spacing:0.04em;\">{{ weightSaveLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff; border:1px solid #e7e1d4; border-radius:18px; padding:16px; margin-bottom:12px;\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;\">\n                <div style=\"font-size:13px; font-weight:600;\">Readiness, last 7 days<\u002Fdiv>\n                <div style=\"font-size:13px; font-weight:700; color:{{ readinessColor }};\">{{ readinessPct }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; gap:5px; align-items:flex-end; height:44px;\">\n                <sc-for list=\"{{ readinessBars }}\" as=\"b\" hint-placeholder-count=\"7\">\n                  <div style=\"flex:1; height:{{ b.height }}; border-radius:4px; background:{{ b.color }};\"><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ openCheckin }}\" class=\"tap\" style=\"width:100%; margin-top:12px; padding:11px 0; border:1px solid #e7e1d4; border-radius:14px; background:transparent; font-size:11px; font-weight:600; color:#5c574c;\">{{ checkinButtonLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ weightHasData }}\">\n              <sc-for list=\"{{ weightEntries }}\" as=\"w\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid #ece6da;\">\n                  <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8a8478;\">{{ w.dateLabel }}<\u002Fspan>\n                  <span style=\"font-size:12px; font-weight:500; color:#1c1c1a;\">{{ w.lbs }} lbs<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ══════════ PLAN ══════════ -->\n        <sc-if value=\"{{ isPlan }}\">\n          <div class=\"fu\">\n            <div style=\"display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:14px; gap:10px;\">\n              <div style=\"font-size:26px; font-weight:700; letter-spacing:-0.02em; white-space:nowrap;\">Week {{ planWeekNum }}<\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:#c9922e; text-align:right;\">{{ planPhaseLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-wrap:wrap; gap:4px; margin-bottom:16px;\">\n              <sc-for list=\"{{ weekChips }}\" as=\"w\" hint-placeholder-count=\"24\">\n                <button sc-camel-on-click=\"{{ w.select }}\" class=\"tap\" style=\"width:34px; padding:7px 0; border-radius:10px; border:1px solid {{ w.border }}; background:{{ w.bg }}; color:{{ w.color }}; font-size:11px; font-weight:{{ w.weight }};\">{{ w.num }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ planDays }}\" as=\"d\" hint-placeholder-count=\"7\">\n              <div style=\"display:flex; gap:12px; background:{{ d.bg }}; border:1px solid {{ d.borderColor }}; border-radius:14px; padding:12px 14px; margin-bottom:7px;\">\n                <div style=\"width:32px; flex-shrink:0; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.06em; color:{{ d.dayColor }}; padding-top:3px;\">{{ d.dayShort }}<\u002Fdiv>\n                <div style=\"flex:1;\">\n                  <div style=\"display:flex; align-items:baseline; gap:8px;\">\n                    <span style=\"font-size:17px; font-weight:700; color:#1c1c1a;\">{{ d.runDist }} padding:8px 8px calc(14px + env(safe-area-inset-bottom,0px));\">\n        <button sc-camel-on-click=\"{{ goToday }}\" class=\"tap\" style=\"flex:1; background:none; border:none; padding:8px 0 4px; display:flex; flex-direction:column; align-items:center; gap:5px;\">\n          <span style=\"font-size:11px; font-weight:{{ todayWeight }}; color:{{ todayColor }};\">Today<\u002Fspan>\n          <span style=\"width:16px; height:2px; border-radius:2px; background:{{ todayBg }};\"><\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goRecord }}\" class=\"tap\" style=\"flex:1; background:none; border:none; padding:8px 0 4px; display:flex; flex-direction:column; align-items:center; gap:5px;\">\n          <span style=\"font-size:11px; font-weight:{{ recordWeight }}; color:{{ recordColor }};\">Record<\u002Fspan>\n          <span style=\"width:16px; height:2px; border-radius:2px; background:{{ recordBg }};\"><\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goBody }}\" class=\"tap\" style=\"flex:1; background:none; border:none; padding:8px 0 4px; display:flex; flex-direction:column; align-items:center; gap:5px;\">\n          <span style=\"font-size:11px; font-weight:{{ bodyWeight }}; color:{{ bodyColor }};\">Body<\u002Fspan>\n          <span style=\"width:16px; height:2px; border-radius:2px; background:{{ bodyBg }};\"><\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goPlan }}\" class=\"tap\" style=\"flex:1; background:none; border:none; padding:8px 0 4px; display:flex; flex-direction:column; align-items:center; gap:5px;\">\n          <span style=\"font-size:11px; font-weight:{{ planWeight }}; color:{{ planColor }};\">Plan<\u002Fspan>\n          <span style=\"width:16px; height:2px; border-radius:2px; background:{{ planBg }};\"><\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <!-- ── Log sheet ── -->\n      <sc-if value=\"{{ showModal }}\">\n        <div class=\"fi\" style=\"position:ab istance (mi)<\u002Fdiv>\n                <input value=\"{{ formDist }}\" sc-camel-on-change=\"{{ setDist }}\" placeholder=\"6.2\" sc-camel-input-mode=\"decimal\" style=\"width:100%; background:#fff; border:1px solid #e7e1d4; border-radius:12px; padding:11px; font-size:22px; font-weight:700; color:#1c1c1a; outline:none;\">\n              <\u002Fdiv>\n              <div style=\"flex:1;\">\n                <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:#8a8478; margin-bottom:6px;\">Pace (/mi)<\u002Fdiv>\n                <input value=\"{{ formPace }}\" sc-camel-on-change=\"{{ setPace }}\" placeholder=\"7:42\" style=\"width:100%; background:#fff; border:1px solid #e7e1d4; border-radius:12px; padding:11px; font-size:22px; font-weight:700; color:#1c1c1a; outline:none;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:#8a8478; margin-bottom:8px;\">How it felt<\u002Fdiv>\n            <div style=\"display:flex; gap:6px; margin-bottom:10px;\">\n              <button sc-camel-on-click=\"{{ setFeel1 }}\" class=\"tap\" style=\"flex:1; padding:13px 0; border-radius:12px; border:1px solid {{ feel1Border }}; background:{{ feel1Bg }}; color:{{ feel1Color }}; font-size:14px; font-weight:700;\">1<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setFeel2 }}\" class=\"tap\" style=\"flex:1; padding:13px 0; border-radius:12px; border:1px solid {{ feel2Border }}; background:{{ feel2Bg }}; color:{{ feel2Color }}; font-size:14px; font-weight:700;\">2<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ setFeel3 }}\" class=\"tap\" style=\"flex:1; padding:13px 0; border-radius:12px; border:1px solid {{ feel3Border }}; background:{{ feel3Bg }}; color:{{ feel3Color }}; font-size:14px; font-weight:700;\">3<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ set int-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ c.select }}\" class=\"tap\" style=\"flex:1; padding:13px 0; border-radius:12px; border:1px solid {{ c.border }}; background:{{ c.bg }}; color:{{ c.color }}; font-size:14px; font-weight:700;\">{{ c.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:#8a8478; margin-bottom:8px;\">How the legs feel<\u002Fdiv>\n            <div style=\"display:flex; gap:6px; margin-bottom:8px;\">\n              <sc-for list=\"{{ legsChips }}\" as=\"c\" hint-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ c.select }}\" class=\"tap\" style=\"flex:1; padding:13px 0; border-radius:12px; border:1px solid {{ c.border }}; background:{{ c.bg }}; color:{{ c.color }}; font-size:14px; font-weight:700;\">{{ c.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"text-align:center; font-size:11px; color:#8a8478; margin-bottom:18px;\">{{ checkinHint }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ saveCheckin }}\" class=\"tap\" style=\"width:100%; padding:16px 0; border:none; border-radius:16px; background:#c9922e; color:#fff; font-size:13px; font-weight:700;\">{{ checkinSaveLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ── Day detail ── -->\n      <sc-if value=\"{{ showDayDetail }}\">\n        <div class=\"fi\" style=\"position:absolute; inset:0; background:rgba(28,28,26,0.45); z-index:106; display:flex; align-items:flex-end;\" sc-camel-on-click=\"{{ closeDayDetail }}\">\n          <div class=\"sheet-up\" style=\"background:#faf7f0; padding:22px 20px 38px; width:100%; border-radius:24px 24px 0 0;\" sc-camel-on-click=\"{{ stopProp }}\">\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:#c9922e; margin-bottom:4px;\">{{ dayDetailStatus }}<\u002Fdiv>\n            <div style=\"font-family:'Instrument Serif',serif; font-size:26px; margin-bottom:14px;\">{{ dayDetailDate }}<\u002Fdiv>\n            <div style=\"background:#fff; border:1px solid #e7e1d4; border-radius:16px; padding:4px 14px;\">\n              <div style=\"display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid #ece6da;\"><span style=\"font-size:11px; color:#8a8478;\">Planned<\u002Fspan><span style=\"font-size:12px; color:#1c1c1a;\">{{ dayDetailAssigned }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid #ece6da;\"><span style=\"font-size:11px; color:#8a8478;\">Distance<\u002Fspan><span style=\"font-size:12px; color:#1c1c1a;\">{{ dayDetailDist }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid #ece6da;\"><span style=\"font-size:11px; color:#8a8478;\">Pace<\u002Fspan><span style=\"font-size:12px; color:#1c1c1a;\">{{ dayDetailPace }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid #ece6da;\"><span style=\"font-size:11px; color:#8a8478;\">Felt<\u002Fspan><span style=\"font-size:12px; color:#1c1c1a;\">{{ dayDetailFeel }}<\u002Fspan><\u002Fdiv>\n              <sc-if value=\"{{ dayDetailHasElev }}\"><div style=\"display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid #ece6da;\"><span style=\"font-size:11px; color:#8a8478;\">Elevation<\u002Fspan><span style=\"font-size:12px; color:#1c1c1a;\">{{ dayDetailElev }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n              <div style=\"display:flex; justify-content:space-between; padding:11px 0;\"><span style=\"font-size:11px; color:#8a8478;\">Source<\u002Fspan><span style=\"font-size:12px; color:#1c1c1a;\">{{ dayDetailSource }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ── Lift detail ── -->\n      <sc-if value=\"{{ showLiftDetail }}\">\n        <div class=\"fi\" style=\"position:absolute; inset:0; background:rgba(28,28,26,0.45); z-index:107; display:flex; align-items:flex-end;\" sc-camel-on-click=\"{{ closeLiftDetail }}\">\n          <div class=\"sheet-up\" style=\"background:#faf7f0; padding:22px 20px 38px; width:100%; border-radius:24px 24px 0 0; max-height:80%; overflow-y:auto;\" sc-camel-on-click=\"{{ stopProp }}\">\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:#c9922e; margin-bottom:4px;\">{{ liftDetailIsDeload }}<\u002Fdiv>\n            <div style=\"font-family:'Instrument Serif',serif; font-size:26px; margin-bottom:16px;\">{{ liftDetailName }}<\u002Fdiv>\n            <sc-for list=\"{{ liftDetailExercises }}\" as=\"ex\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #ece6da;\">\n                <div>\n                  <div style=\"font-size:13px; font-weight:600; color:#1c1c1a;\">{{ ex.name }}<\u002Fdiv>\n                  <div style=\"font-size:11px; color:#8a8478; margin-top:2px;\">{{ ex.sets }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:13px; font-weight:700; color:#c9922e;\">{{ ex.weight }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ── Settings ── -->\n      <sc-if value=\"{{ showSettings }}\">\n        <div class=\"fi\" style=\"position:absolute; inset:0; background:rgba(28,28,26,0.45); z-index:110; display:flex; align-items:flex-end;\" sc-camel-on-click=\"{{ closeSettings }}\">\n          <div class=\"sheet-up\" style=\"background:#faf7f0; padding:22px 20px 38px; width:100%; max-height:90%; overflow-y:auto; border-radius:24px 24px 0 0;\" sc-camel-on-click=\"{{ stopProp }}\">\n            <div style=\"font-family:'Instrument Serif',serif; font-size:26px; margin-bottom:16px;\">Settings<\u002Fdiv>\n\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#c9922e; margin-bottom:8px;\">Gear &amp; routes<\u002Fdiv>\n            <div style=\"background:#fff; border:1px solid #e7e1d4; border-radius:16px; padding:15px; margin-bottom:10px;\">\n              <div style=\"font-size:13px; font-weight:600; margin-bottom:3px;\">Shoes<\u002Fdiv>\n              <div style=\"font-size:11px; color:#8a8478; margin-bottom:10px; line-height:1.5;\">Mileage adds up from the runs you log. No pairing needed.<\u002Fdiv>\n              <sc-if value=\"{{ hasShoe }}\">\n                <div style=\"display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid #ece6da;\">\n                  <div><div style=\"font-size:12px; font-weight:500;\">{{ shoeName }}<\u002Fdiv><div style=\"font-size:10px; color:#8a8478;\">{{ shoeDetail }}<\u002Fdiv><\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ retireShoe }}\" class=\"tap\" style=\"border:1px solid #e7e1d4; border-radius:10px; background:transparent; padding:7px 10px; font-size:10px; color:#5c574c;\">Retire<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex; gap:6px; margin-top:10px;\">\n                <input value=\"{{ shoeForm }}\" sc-camel-on-change=\"{{ setShoeForm }}\" placeholder=\"New pair name\" style=\"flex:1; background:#faf7f0; border:1px solid #e7e1d4; border-radius:10px; padding:9px; font-size:12px; color:#1c1c1a; outline:none;\">\n                <button sc-camel-on-click=\"{{ addShoe }}\" class=\"tap\" style=\"border:none; border-radius:10px; background:#1c1c1a; color:#fff; padding:9px 14px; font-size:11px; font-weight:600;\">Add<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff; border:1px solid #e7e1d4; border-radius:16px; padding:15px; margin-bottom:10px;\">\n              <div style=\"font-size:13px; font-weight:600; margin-bottom:3px;\">Routes<\u002Fdiv>\n              <div style=\"font-size:11px; color:#8a8478; margin-bottom:10px; line-height:1.5;\">Save the loops you actually run so logging is one tap.<\u002Fdiv>\n              <sc-for list=\"{{ routeList }}\" as=\"r\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid #ece6da;\">\n                  <div style=\"font-size:12px;\">{{ r.label }}<\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ r.remove }}\" class=\"tap\" style=\"border:1px solid #e7e1d4; border-radius:10px; background:transparent; padding:6px 9px; font-size:10px; color:#5c574c;\">Remove<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:flex; gap:6px; margin-top:10px;\">\n                <input value=\"{{ routeNameForm }}\" sc-camel-on-change=\"{{ setRouteNameForm }}\" placeholder=\"Route name\" style=\"flex:2; background:#faf7f0; border:1px solid #e7e1d4; border-radius:10px; padding:9px; font-size:12px; color:#1c1c1a; outline:none;\">\n                <input value=\"{{ routeDistForm }}\" sc-camel-on-change=\"{{ setRouteDistForm }}\" placeholder=\"mi\" sc-camel-input-mode=\"decimal\" style=\"flex:1; background:#faf7f0; border:1px solid #e7e1d4; border-radius:10px; padding:9px; font-size:12px; color:#1c1c1a; outline:none;\">\n                <button sc-camel-on-click=\"{{ addRoute }}\" class=\"tap\" style=\"border:none; border-radius:10px; background:#1c1c1a; color:#fff; padding:9px 12px; font-size:11px; font-weight:600;\">Add<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#c9922e; margin:16px 0 8px;\">Streak &amp; plan<\u002Fdiv>\n            <div style=\"background:#fff; border:1px solid #e7e1d4; border-radius:16px; padding:15px; margin-bottom:10px;\">\n              <div style=\"font-size:13px; font-weight:600; margin-bottom:8px;\">Streak start date<\u002Fdiv>\n              <input value=\"{{ streakStartForm }}\" sc-camel-on-change=\"{{ setStreakStartForm }}\" type=\"date\" style=\"width:100%; background:#faf7f0; border:1px solid #e7e1d4; border-radius:10px; padding:10px; font-size:13px; color:#1c1c1a; outline:none; margin-bottom:8px;\">\n              <button sc-camel-on-click=\"{{ saveStreakStartDate }}\" class=\"tap\" style=\"border:1px solid #c9922e; border-radius:10px; background:transparent; color:#c9922e; padding:9px 14px; font-size:11px; font-weight:600;\">{{ streakStartSaveLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff; border:1px solid #e7e1d4; border-radius:16px; padding:15px; margin-bottom:10px;\">\n              <div style=\"font-size:13px; font-weight:600; margin-bottom:8px;\">Training plan start date<\u002Fdiv>\n              <input value=\"{{ planStartForm }}\" sc-camel-on-change=\"{{ setPlanStartForm }}\" type=\"date\" style=\"width:100%; background:#faf7f0; border:1px solid #e7e1d4; border-radius:10px; padding:10px; font-size:13px; color:#1c1c1a; outline:none; margin-bottom:8px;\">\n              <button sc-camel-on-click=\"{{ savePlanStartDate }}\" class=\"tap\" style=\"border:1px solid #c9922e; border-radius:10px; background:transparent; color:#c9922e; padding:9px 14px; font-size:11px; font-weight:600;\">{{ planStartSaveLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#c9922e; margin:16px 0 8px;\">Data &amp; sync<\u002Fdiv>\n            <div style=\"background:#fff; border:1px solid #eddcd5; border-radius:16px; padding:15px; margin-bottom:10px;\">\n              <div style=\"font-size:13px; font-weight:600; margin-bottom:3px;\">Direct Strava connect — needs a paid Strava plan<\u002Fdiv>\n              <div style=\"font-size:11px; color:#8a8478; line-height:1.5;\">Strava now requires an active Strava subscription to create an API connection, even just for your own data. Since that's a real ongoing cost, use the free import below instead — same result, no subscription.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff; border:1px solid #e7e1d4; border-radius:16px; padding:15px; margin-bottom:10px;\">\n              <div style=\"font-size:13px; font-weight:600; margin-bottom:3px;\">Import from Strava or Garmin — free<\u002Fdiv>\n              <div style=\"font-size:11px; color:#8a8478; margin-bottom:10px; line-height:1.5;\">Free, no linking or login. Strava: Settings → My Account → Download or Delete Your Account → request your archive, unzip, pick activities.csv. Garmin Connect: Activities → Export CSV. Runs since your streak start fill in your Record; older runs update your all-time totals.<\u002Fdiv>\n              <input type=\"file\" accept=\".csv\" sc-camel-on-change=\"{{ onImportFile }}\" class=\"tap\" style=\"width:100%; font-size:11px; color:#5c574c; margin-bottom:8px;\">\n              <sc-if value=\"{{ importCsvStatus }}\"><div style=\"font-size:11px; color:{{ importCsvColor }}; line-height:1.5;\">{{ importCsvStatus }}<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff; border:1px solid #e7e1d4; border-radius:16px; padding:15px; margin-bottom:10px;\">\n              <div style=\"font-size:13px; font-weight:600; margin-bottom:3px;\">Back up your data<\u002Fdiv>\n              <div style=\"font-size:11px; color:#8a8478; margin-bottom:10px; line-height:1.5;\">Everything lives on this phone only. Copy this text somewhere safe.<\u002Fdiv>\n              <div style=\"display:flex; gap:6px;\">\n                <button sc-camel-on-click=\"{{ doExport }}\" class=\"tap\" style=\"border:1px solid #e7e1d4; border-radius:10px; background:transparent; color:{{ exportColor }}; padding:9px 14px; font-size:11px; font-weight:600;\">{{ exportLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <textarea value=\"{{ importText }}\" sc-camel-on-change=\"{{ setImportText }}\" placeholder=\"Paste a backup here to restore\" rows=\"2\" style=\"width:100%; background:#faf7f0; border:1px solid #e7e1d4; border-radius:10px; padding:10px; font-size:11px; color:#1c1c1a; resize:none; outline:none; margin:10px 0;\"><\u002Ftextarea>\n              <button sc-camel-on-click=\"{{ doImport }}\" class=\"tap\" style=\"border:1px solid #e7e1d4; border-radius:10px; background:transparent; color:#1c1c1a; padding:9px 14px; font-size:11px; font-weight:600;\">{{ importLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#a4482c; margin:16px 0 8px;\">Danger zone<\u002Fdiv>\n            <div style=\"background:#fff; border:1px solid #eddcd5; border-radius:16px; padding:15px;\">\n              <div style=\"font-size:13px; font-weight:600; margin-bottom:3px;\">I didn't run today<\u002Fdiv>\n              <div style=\"font-size:11px; color:#8a8478; line-height:1.5; margin-bottom:10px;\">The only thing that breaks the streak. On purpose, never automatic.<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ markTodayMissed }}\" class=\"tap\" style=\"border:1px solid #c0705f; border-radius:10px; background:transparent; color:#a4482c; padding:9px 14px; font-size:11px; font-weight:600;\">Mark today missed<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ── Celebration ── -->\n      <sc-if value=\"{{ showCelebration }}\">\n        <div class=\"fi\" style=\"position:absolute; inset:0; background:#faf7f0; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:34px; text-align:center;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:#c9922e; margin-bottom:22px;\">{{ celebrationEyebrow }}<\u002Fdiv>\n          <div class=\"pop\" style=\"width:172px; height:172px; border-radius:50%; background:#1c1c1a; display:flex; align-items:center; justify-content:center; margin-bottom:24px;\">\n            <div style=\"font-size:58px; font-weight:700; color:#faf7f0; letter-spacing:-0.03em; font-variant-numeric:tabular-nums;\">{{ celebrationValue }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.6; color:#5c574c; max-width:250px; margin-bottom:30px;\">{{ celebrationSub }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ dismissCelebration }}\" class=\"tap\" style=\"padding:14px 34px; border:none; border-radius:16px; background:#c9922e; color:#fff; font-size:12px; font-weight:700;\">Continue<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst INK = '#1c1c1a';\nconst GREEN = '#5c7a5f';\nconst MUTED = '#8a8478';\nconst FAINT = '#b3ac9e';\nconst RED = '#a4482c';\nconst ACCENT = '#c9922e';\nconst SURF = '#ffffff';\nconst LINE = '#e7e1d4';\nconst TABS = ['today','record','body','plan'];\nconst RING_ARC = 559;\nconst RING_TRACK = RING_ARC + ' 640';\n\n// ── Inlined engine (was ./v2-engine.js) ─────────────────────────────────\n// Bundled standalone builds serve from a blob: URL where a dynamic\n// import('./v2-engine.js') 404s silently, leaving state.engine null forever.\n// Inlining removes that failure mode entirely; live STREAK_START/BASE_PLAN_START\n// overrides are preserved via getters (matches ES module live-binding semantics).\nconst ENGINE = (function(){\n// Litch Training v2 — shared logic engine (data model, streak, training plan,\n// recovery system, weekly check-in, v1 migration). Pure functions + localStorage\n// helpers only — no React, no UI — imported by any screen/visual direction.\n\nlet STREAK_START = new Date('2025-03-03T00:00:00');\nconst CYCLE_LEN = 168; // 24 weeks\nconst RACE_OFFSET = 166;\nconst DELOAD_WEEKS = new Set([4,8,12,16,20]);\nlet BASE_PLAN_START = new Date('2026-06-17T00:00:00');\n\nconst mid = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };\nconst ds = d => d.toISOString().split('T')[0];\nconst dBetween = (a,b) => Math.round((mid(b)-mid(a))/86400000);\nconst addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };\n\nfunction ld(key, fb){ try{ const v=localStorage.getItem('lt2-'+key); if(v) return JSON.parse(v); }catch{} return fb; }\nfunction sv(key, v){ try{ localStorage.setItem('lt2-'+key, JSON.stringify(v)); }catch{} }\n\nfunction loadState(){\n  return {\n    runLogs: ld('runLogs', {}),\n    missedDays: ld('missedDays', {}),\n    readiness: ld('readiness', {}),\n    liftLogs: ld('liftLogs', {}),\n    settings: {historicalRuns:518, historicalMiles:1352, ...ld('settings', {limitedGym:false, theme:'sand', units:'mi'})},\n    weeklyCheckins: ld('weeklyCheckins', {}),\n    migrated: ld('migrated', false),\n  };\n}\nfunction saveSlice(key, val){ sv(key, val); }\n\nfunction calcStreak(missedDays, today, runLogs, settings){\n  const cutover = settings?.logRequiredFrom ? new Date(settings.logRequiredFrom+'T00:00:00') : null;\n  if(!cutover || !runLogs){\n    const totalDays = dBetween(STREAK_START, today) + 1;\n    const missedCount = Object.keys(missedDays).filter(d => mid(new Date(d+'T00:00:00')) <= mid(today)).length;\n    return Math.max(0, totalDays - missedCount);\n  }\n  const beforeCutoverDays = Math.max(0, dBetween(STREAK_START, cutover));\n  const missedBefore = Object.keys(missedDays).filter(d => { const dt=mid(new Date(d+'T00:00:00')); return dt < mid(cutover) && dt >= mid(STREAK_START); }).length;\n  const historicCount = Math.max(0, beforeCutoverDays - missedBefore);\n  let loggedCount = 0;\n  const spanDays = dBetween(cutover, today) + 1;\n  for(let i=0;i<spanDays;i++){\n    const d = addDays(cutover, i);\n    const key = ds(d);\n    if(missedDays[key]) continue;\n    if(runLogs[key]) loggedCount++;\n  }\n  return historicCount + loggedCount;\n}\nfunction enableLogGating(settings, todayDateStr){\n  const ns = { ...settings, logRequiredFrom: todayDateStr };\n  sv('settings', ns);\n  return ns;\n}\nfunction disableLogGating(settings){\n  const ns = { ...settings, logRequiredFrom: null };\n  sv('settings', ns);\n  return ns;\n}\nfunction isLogGated(settings){ return !!settings?.logRequiredFrom; }\nfunction todayIsPending(settings, today, runLogs, missedDays){\n  if(!isLogGated(settings)) return false;\n  const key = ds(today);\n  return !runLogs[key] && !missedDays[key];\n}\n\nfunction markMissed(missedDays, dateKey, reason){\n  const nm = {...missedDays, [dateKey]: reason || true};\n  sv('missedDays', nm);\n  return nm;\n}\nfunction unmarkMissed(missedDays, dateKey){\n  const nm = {...missedDays};\n  delete nm[dateKey];\n  sv('missedDays', nm);\n  return nm;\n}\n\nfunction weekKeyFor(date){\n  const days = dBetween(STREAK_START, date);\n  return 'w' + Math.floor(days/7);\n}\nfunction needsWeeklyCheckin(weeklyCheckins, today){\n  const wk = weekKeyFor(today);\n  const days = dBetween(STREAK_START, today);\n  if(days < 7) return false;\n  return !weeklyCheckins[wk];\n}\nconst REAL_MILESTONES = [100, 250, 365, 500, 750, 1000];\nfunction nextMilestone(streak){\n  const named = REAL_MILESTONES.find(m => m > streak);\n  if(named) return named;\n  return Math.ceil((streak+1)/250) * 250;\n}\nfunction prevMilestone(streak){\n  const named = [...REAL_MILESTONES].reverse().find(m => m <= streak);\n  const generated = Math.floor(stre d steady'; tone='neutral'; }\n  return { ratio: Math.round(ratio*100)/100, label, pct, tone };\n}\n\nfunction paceEvidence(runLogs, today){\n  const out = [];\n  for(let i=0;i<28 && out.length<10;i++){\n    const d = new Date(today); d.setDate(d.getDate()-i);\n    const log = runLogs[ds(d)];\n    if(!log || !log.pace) continue;\n    const w = getWorkout(d, false);\n    if(!w.run || !['Easy','Recovery','Long Run'].includes(w.run.type)) continue;\n    out.push({\n      dateLabel: d.toLocaleDateString('en-US',{month:'short',day:'numeric'}),\n      pace: log.pace,\n      feel: log.feel,\n      prescribed: w.run.pace,\n    });\n  }\n  return out;\n}\n\nfunction applyDateOverrides(settings){\n  if(settings?.streakStartOverride) STREAK_START = new Date(settings.streakStartOverride+'T00:00:00');\n  if(settings?.planStartOverride) BASE_PLAN_START = new Date(settings.planStartOverride+'T00:00:00');\n}\nfunction saveStreakStart(settings, dateStr){\n  const ns = { ...settings, streakStartOverride: dateStr };\n  sv('settings', ns);\n  applyDateOverrides(ns);\n  return ns;\n}\nfunction savePlanStart(settings, dateStr){\n  const ns = { ...settings, planStartOverride: dateStr };\n  sv('settings', ns);\n  applyDateOverrides(ns);\n  return ns;\n}\nfunction saveHistoricalBaseline(settings, runs, miles){\n  const ns = { ...settings, historicalRuns: runs, historicalMiles: miles };\n  sv('settings', ns);\n  return ns;\n}\nfunction totalsWithBaseline(runLogs, settings){\n  let miles = 0, runs = 0;\n  Object.values(runLogs||{}).forEach(l => { if(l.distance) miles += l.distance; runs++; });\n  return {\n    runs: runs + (settings?.historicalRuns || 0),\n    miles: Math.round((miles + (settings?.historicalMiles || 0)) * 10) / 10,\n    loggedHere: runs,\n  };\n}\n\nfunction loadWeights(){ return ld('weights', {}); }\nfunction saveWeightEntry(weights, dateKey, lbs, note){\n  const nw = { ...weights, [dateKey]: { lbs, note: note||'', at: new Date().toISOString() } };\n  sv('weights', nw);\n  return nw;\n}\nfunction weightTrend(weights){\n  const entries = Object.entries(weights||{}).sort((a,b)=>a[0].localeCompare(b[0]));\n  if(!entries.length) return null;\n  const first = entries[0][1].lbs, latest = entries[entries.length-1][1].lbs;\n  return { first, latest, change: Math.round((latest-first)*10)/10, entries: entries.slice(-8).reverse() };\n}\n\nconst FUEL_DAY_TYPES = {\n  long: { label:'Long Run / Quality Day', note:'Higher carb — this is your hardest training day. Oats or fruit before, rice or potatoes with dinner.' },\n  lift: { label:'Lift Day', note:'Moderate carb, protein-forward. Don\\u2019t skip the post-lift meal.' },\n  easy: { label:'Easy / Recovery Day', note:'Standard balanced plate. Nothing special required — you\\u2019re still running daily.' },\n};\nfunction todayFuelType(workout){\n  if(workout?.run && (workout.run.type==='Quality' || workout.run.type==='Long Run')) return 'long';\n  if(workout?.lift) return 'lift';\n  return 'easy';\n}\n\nfunction browsePlanWeek(week, limitedGym){\n  const globalWeek = week;\n  const days = [];\n  for(let dow=0; dow<7; dow++) days.push(buildWorkout(week, dow, globalWeek, limitedGym));\n  return { week, phase: phaseOf(week), phaseName: PNAMES[phaseOf(week)], isDeload: DELOAD_WEEKS.has(week), days };\n}\n\nfunction checkPersonalBest(runLogs, newEntry, dateKey){\n  if(!newEntry.pace) return false;\n  const toSec = p => { const m=p.match(/^(\\d{1,2}):(\\d{2})$/); return m?parseInt(m[1])*60+parseInt(m[2]):null; };\n  const newSec = toSec(newEntry.pace);\n  if(newSec==null) return false;\n  let best = null;\n  Object.entries(runLogs).forEach(([d,l])=>{ if(d===dateKey || !l.pace) return; const s=toSec(l.pace); if(s!=null && (best==null || s<best)) best=s; });\n  return best==null || newSec < best;\n}\n\nfunction saveWeeklyCheckin(weeklyCheckins, today, stillTraining){\n  const wk = weekKeyFor(today);\n  const nc = {...weeklyCheckins, [wk]: stillTraining ? 'confirmed' : 'stopped'};\n  sv('weeklyCheckins', nc);\n  return nc;\n}\n\nconst LONG_RUN_BASE = {1:4,2:4.5,3:5,4:3,5:5,6:5.5,7:6,8:4,9:8,10:8.5,11:9,12:6,13:9.5,14:10,15:10.5,16:7,17:11,18:12,19:13,20:8,21:10,22:8,23:6,24:3};\n// Long-run pace zones are anchored to a real logged effort (6.24mi @ 9:15/mi) rather than a generic default,\n// then tighten slightly phase over phase as aerobic fitness builds.\nconst PHASE_LONG_PACE = {1:'9:15–9:50/mi',2:'9:00–9:35/mi',3:'8:45–9:15/mi',4:'9:00–9:30/mi'};\n// Periodized so real speed work (mile repeats / 800s) doesn't start until Build phase (week 9+) —\n// Base phase is aerobic + tempo only, consistent with standard base->build->peak periodization.\nconst QUALITY_BY_WEEK = {\n  1:'A',2:'A',3:'C',4:'easy',5:'A',6:'C',7:'A',8:'easy',\n  9:'B',10:'C',11:'D',12:'easy',\n  13:'B',14:'D',15:'C',16:'easy',\n  17:'B',18:'D',19:'A',20:'easy',\n  21:'C',22:'A',23:'easy',24:'easy'\n};\n// Every pace here is set relative to actual logged effort, not a generic \"average runner\" number:\n// tempo (A) matches sustained ~7:00–7:20/mi already run; reps (B/D) are a believable stretch just\n// above that, not a made-up number disconnected from current ability.\nconst QUALITY = {\n  A:{name:'Tempo Run', total:'4 mi', desc:'1 mi easy → 2 mi @ 7:00–7:20/mi → 1 mi easy', why:'Matches your own recent sustained pace — this is the one day that pace is meant to feel like effort.'},\n  B:{name:'Mile Repeats', total:'~5 mi', desc:'1 mi easy → 3×1 mi @ 6:45–7:00/mi (2 min rest) → 1 mi easy', why:'A believable stretch just above your logged tempo pace, not a random fast number.'},\n  C:{name:'Progression Run', total:'4–5 mi', desc:'Start 9:15/mi, ~15s faster each mile, finish 7:15/mi', why:'Starts at true easy effort and finishes near your tempo pace — teaches control, not just speed.'},\n  D:{name:'800m Intervals', total:'~5 mi', desc:'1 mi easy → 5×800m @ 6:45–6:55/mi (90s rest) → 1 mi easy', why:'Short enough to hold just above tempo pace safely.'},\n  easy:{name:'Easy Quality', total:'3 mi', desc:'Easy effort the whole way — deload/taper week.', why:''},\n};\nconst LOWER_EX=[\n  {name:'Trap Bar Deadlift', base:185, addEvery:2, addAmt:10, sets:'3×6'},\n  {name:'Bulgarian Split Squat', base:40, addEvery:2, addAmt:5, sets:'3×8 ea', unit:'lb DBs'},\n  {name:'Single-Leg RDL', base:30, addEvery:2, addAmt:5, sets:'3×8 ea', unit:'lb DBs'},\n  {name:'Lateral Band Walk', fixed:'Medium band', sets:'3×15 ea'},\n  {name:'Eccentric Calf Raise', fixed:'Bodyweight', sets:'3×15'},\n];\nconst UPPER_EX=[\n  {name:'DB Bench Press', base:60, addEvery:2, addAmt:5, sets:'3×8', unit:'lb DBs'},\n  {name:'Barbell Row', base:115, addEvery:2, addAmt:10, sets:'3×8'},\n  {name:'Pull-Ups / Lat Pulldown', fixed:'BW / 100 lbs', sets:'3×6–10'},\n  {name:'DB Overhead Press', base:35, addEvery:3, addAmt:5, sets:'3×8', unit:'lb DBs'},\n  {name:'Face Pulls', fixed:'Light cable', sets:'3×15'},\n];\nconst ATHLETIC_EX=[\n  {name:'Box Jump', fixed:'Bodyweight', sets:'3×5'},\n  {name:'Hang Clean', base:95, addEvery:3, addAmt:10, sets:'3×4'},\n  {name:\"Farmer's Carry\", base:60, addEvery:3, addAmt:5, sets:'3×40yd', unit:'lb DBs'},\n  {name:'Ab Wheel / Plank', fixed:'BW', sets:'3×45s'},\n];\nconst SHOULDER_CARE=[\n  {name:'Banded External Rotation', sets:'2×15 each'},\n  {name:'Wall Slides', sets:'2×10'},\n  {name:'Scapular Retraction Hold', sets:'2×20s'},\n  {name:'Sleeper Stretch', sets:'2×30s each side'},\n];\n\nfunction calcWeight(ex, globalWeek){\n  if(ex.fixed) return ex.fixed;\n  const steps = ex.addEvery>0 ? Math.max(0, Math.floor((globalWeek-1)/ex.addEvery)) : 0;\n  const w = Math.max(ex.base, ex.base + steps*ex.addAmt);\n  return ex.unit ? w+' '+ex.unit : w+' lbs';\n}\n\nfunction getCycleStructure(date){\n  const diff = dBetween(BASE_PLAN_START, date);\n  if(diff < 0) return {status:'preview', cycleIndex:0, week:1, dow:0, globalWeek:1};\n  const cycleIndex = Math.floor(diff/CYCLE_LEN);\n  const diffInCycle = diff - cycleIndex*CYCLE_LEN;\n  const week = Math.floor(diffInCycle/7)+1;\n  const dow = diffInCycle%7;\n  return {status:'active', cycleIndex, diffInCycle, week, dow, globalWeek: cycleIndex*24+week};\n}\nfunction raceDateForCycle(cycleIndex){ return addDays(BASE_PLAN_START, cycleIndex*CYCLE_LEN + RACE_OFFSET); }\nfunction nextRaceDate(today){\n  const s = getCycleStructure(today);\n  if(s.status==='preview') return raceDateForCycle(0);\n  return s.diffInCycle <= RACE_OFFSET ? raceDateForCycle(s.cycleIndex) : raceDateForCycle(s.cycleIndex+1);\n}\nfunction phaseOf(week){ return week<=8?1:week<=16?2:week<=20?3:4; }\nconst PNAMES={1:'Base',2:'Build',3:'Peak',4:'Taper'};\n\nfunction buildWorkout(week, dow, globalWeek, limitedGym){\n  const isDeload = DELOAD_WEEKS.has(week);\n  const phase = phaseOf(week);\n  const longPace = PHASE_LONG_PACE[phase];\n  const qt = QUALITY_BY_WEEK[week] || 'easy';\n  // True easy/recovery paces are deliberately slower than the ~7:00–8:15/mi mix of logged runs that had\n  // no clear plan behind them — the point is to stop living in that in-between \"gray zone\" every day\n  // (the classic reason unstructured runners plateau) and save faster paces for the one Quality day.\n  const EASY = '9:00–9:45/mi';\n  const RECOVERY = '9:45–10:15/mi';\n  let run, lift;\n  if(dow===0){ run={type:'Easy', dist:'2–3 mi', pace:EASY}; lift={name:isDeload?'Lower Body (Deload)':'Lower Body', exercises:LOWER_EX.map(e=>({...e,currentWeight:calcWeight(e,globalWeek)})), isDeload}; }\n  else if(dow===1){\n    run = isDeload ? {type:'Easy', dist:'2 mi', pace:EASY, note:'Deload — no quality run.'} : {type:'Quality', ...QUALITY[qt]};\n    lift = isDeload ? null : {name:'Athletic / Power', exercises:ATHLETIC_EX.map(e=>({...e,currentWeight:calcWeight(e,globalWeek)})), isDeload:false};\n  }\n  else if(dow===2){ run={type:'Easy', dist:'2–3 mi', pace:EASY}; lift={name:isDeload?'Upper Body (Deload)':'Upper Body', exercises:UPPER_EX.map(e=>({...e,currentWeight:calcWeight(e,globalWeek)})), isDeload}; }\n  else if(dow===3){ run={type:'Easy', dist:'3 mi', pace:EASY, note:'Buffer before long run.'}; lift=null; }\n  else if(dow===4){ run={type:'Recovery', dist:'2 mi', pace:RECOVERY, note:'Genuinely easy pace — the goal is blood flow, not effort. Mobility work, an easy walk, or a breathwork session all count as real recovery here; a hard class does not, even a good one.'}; lift=null; }\n  else if(dow===5){ run={type:'Long Run', dist:(LONG_RUN_BASE[week]||4)+' mi', pace:longPace, note: isDeload?'Deload long run, easy effort.':'Progresses with phase.'}; lift=null; }\n  else { run={type:'Recovery', dist:'2 mi', pace:RECOVERY, note:'Shakeout only — legs should feel fresher after this than before. Static stretching or a few minutes of breathwork afterward helps more than another hard session.'}; lift=null; }\n  return {week, phase, phaseName:PNAMES[phase], isDeload, dow, run, lift, qualityType:qt};\n}\nfunction getWorkout(date, limitedGym){\n  const s = getCycleStructure(date);\n  if(s.status==='preview') return {...buildWorkout(1,0,1,limitedGym), status:'preview'};\n  return {...buildWorkout(s.week, s.dow, s.globalWeek, limitedGym), status:'active', cycleIndex:s.cycleIndex, diffInCycle:s.diffInCycle};\n}\n\nfunction detectFatiguePattern(readiness, today){\n  const recent = [];\n  for(let i=0;i<10 && recent.length<7;i++){\n    const d = new Date(today); d.setDate(d.getDate()-i);\n    const r = readiness[ds(d)];\n    if(r) recent.push(r);\n  }\n  if(recent.length < 4) return false;\n  const heavyCount = recent.filter(r => r.feel && r.feel<=2).length;\n  return heavyCount >= Math.ceil(recent.length*0.5);\n}\nfunction applyRecoveryDowngrade(workout){\n  if(!workout || !workout.run) return workout;\n  const wasHard = !['Recovery','Easy'].includes(workout.run.type) || !!workout.lift;\n  const label = workout.lift ? workout.run.type+' + '+workout.lift.name : workout.run.type;\n  const downgraded = {type:'Recovery', dist:'2 mi', pace:'10:00+/mi', downgraded:true};\n  return {...workout, run:downgraded, lift:null, bumpedSession: wasHard ?
